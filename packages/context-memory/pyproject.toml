[project]
name = "context-memory"
version = "0.1.0"
description = "Persistent storage, tiered caching, and intelligent retrieval for ContextEngine"
requires-python = ">=3.12"
dependencies = [
    "context-core>=0.1.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
s3 = ["aioboto3>=12.0"]
all = ["context-memory[sqlite,postgres,redis,s3]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/context_memory"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_memory"]
sources = ["src"]

[tool.uv.sources]
context-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]
