[project]
name = "context-tools"
version = "0.1.0"
description = "Tool call optimization for ContextEngine: caching, patterns, compression, prefetching"
requires-python = ">=3.12"
dependencies = [
    "context-core>=0.1.0",
    "context-memory>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
all = ["context-tools[ml]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/context_tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_tools"]
sources = ["src"]

[tool.uv.sources]
context-core = { workspace = true }
context-memory = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
