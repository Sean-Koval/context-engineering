[project]
name = "context-tools"
version = "0.1.0"
description = "Tool call caching, usage patterns, and result compression for ContextEngine"
requires-python = ">=3.12"
dependencies = [
    "context-core>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/context_tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_tools"]
sources = ["src"]

[tool.uv.sources]
context-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]
