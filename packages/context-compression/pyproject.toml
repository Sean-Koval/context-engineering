[project]
name = "context-compression"
version = "0.1.0"
description = "Compression pipeline for ContextEngine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "context-core",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/context_compression"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_compression"]
sources = ["src"]

[tool.uv.sources]
context-core = { workspace = true }

[dependency-groups]
dev = [
    "numpy>=2.4.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.0",
]
