[project]
name = "context-core"
version = "0.1.0"
description = "Core data structures for ContextEngine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
embeddings = ["sentence-transformers>=2.2"]
tiktoken = ["tiktoken>=0.5"]
qdrant = ["qdrant-client>=1.7"]
semantic = ["sentence-transformers>=2.2", "qdrant-client>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/context_core"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_core"]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
